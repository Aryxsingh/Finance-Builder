<title>Finance OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — scrolling screen, sticky title bar, fixed bottom tab bar with a raised Add button. */
:root {
  --bg: #f3f5f2;           /* faint green-grey paper */
  --surface: #ffffff;
  --surface-2: #e9ede8;
  --line: #d9dfd8;
  --fg: #121a16;
  --fg-2: #4b5751;
  --fg-3: #7d8983;
  --accent: #0e7a5c;       /* rupee-note green */
  --accent-ink: #ffffff;
  --accent-soft: #d8efe6;
  --good: #0f8a3a;
  --warn: #b07800;
  --warn-soft: #fbefd2;
  --bad: #c43434;
  --bad-soft: #f9dede;
  --c-income: #2a78d6;
  --c-spend: #eb6834;
  --c-3: #1baf7a;
  --shadow: 0 1px 2px rgba(18, 26, 22, .06), 0 6px 24px rgba(18, 26, 22, .06);
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1210; --surface: #161d1a; --surface-2: #202925; --line: #2b3631;
    --fg: #ecf2ee; --fg-2: #aab6b0; --fg-3: #75827c;
    --accent: #3fc79a; --accent-ink: #062018; --accent-soft: #163a2e;
    --good: #43c76c; --warn: #f0b429; --warn-soft: #3a2f12; --bad: #f06a6a; --bad-soft: #3d1b1b;
    --c-income: #3987e5; --c-spend: #d95926; --c-3: #199e70;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1210; --surface: #161d1a; --surface-2: #202925; --line: #2b3631;
  --fg: #ecf2ee; --fg-2: #aab6b0; --fg-3: #75827c;
  --accent: #3fc79a; --accent-ink: #062018; --accent-soft: #163a2e;
  --good: #43c76c; --warn: #f0b429; --warn-soft: #3a2f12; --bad: #f06a6a; --bad-soft: #3d1b1b;
  --c-income: #3987e5; --c-spend: #d95926; --c-3: #199e70;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
#root { max-width: 560px; margin: 0 auto; min-height: 100%; }

.screen { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 14px 8px; }
.topbar h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -.02em; margin: 0; flex: 1; min-width: 0; }
.topbar .sub { color: var(--fg-3); font-size: 13px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }

.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-3); font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.card h2 .spacer { flex: 1; }
.card h2 button { text-transform: none; letter-spacing: 0; }
.muted { color: var(--fg-3); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Hero: Safe to Spend */
.hero { background: var(--accent); color: var(--accent-ink); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
.hero .label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; opacity: .85; }
.hero .big { font-family: var(--font-display); font-size: clamp(40px, 13vw, 56px); font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.hero .meta { font-size: 14px; opacity: .9; }
.hero .break { margin-top: 10px; border-top: 1px solid color-mix(in srgb, var(--accent-ink) 25%, transparent); padding-top: 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.hero button.link { color: inherit; opacity: .9; }
.hero.short { background: var(--bad); color: #fff; }

.stat { background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; border: 0; }
.stat .k { font-size: 12px; color: var(--fg-3); font-weight: 600; }
.stat .v { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
.stat .s { font-size: 12px; color: var(--fg-3); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.pill.good { background: var(--accent-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }

.tx { display: flex; align-items: center; gap: 12px; padding: 10px 0; border: 0; background: none; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
.tx:last-child { border-bottom: 0; }
.tx .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--fg-2); flex: none; }
.tx .amt { font-weight: 700; white-space: nowrap; }
.tx .amt.in { color: var(--good); }
.daylabel { font-size: 12px; font-weight: 700; color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; padding-top: 6px; display: flex; justify-content: space-between; }

/* Bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); align-items: end; }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 8px; font-size: 11px; font-weight: 600; color: var(--fg-3); }
.nav button svg { width: 22px; height: 22px; }
.nav button.on { color: var(--accent); }
.nav .add { position: relative; }
.nav .add span.fab { width: 54px; height: 54px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: -22px; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent); }
.nav .add span.fab svg { width: 28px; height: 28px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--fg-2); }
.input, select.input, textarea.input { width: 100%; min-width: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 16px; }
textarea.input { min-height: 64px; resize: vertical; }
.btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 700; background: var(--surface-2); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .5; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 3px; border-radius: 12px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-weight: 600; font-size: 14px; color: var(--fg-2); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 500; white-space: nowrap; flex: none; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(5, 10, 8, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); border-radius: 22px 22px 0 0; overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 4px auto 0; flex: none; }
.sheet .head { display: flex; align-items: center; gap: 10px; }
.sheet .head h3 { margin: 0; flex: 1; font-family: var(--font-display); font-size: 22px; letter-spacing: -.02em; }
.amount-in { display: flex; align-items: baseline; gap: 4px; border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
.amount-in span { font-family: var(--font-display); font-size: 34px; color: var(--fg-3); }
.amount-in input { border: 0; background: none; outline: none; font-family: var(--font-display); font-size: 44px; font-weight: 700; width: 100%; min-width: 0; letter-spacing: -.02em; padding: 0; }

.banner { border-radius: 14px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { background: var(--warn-soft); color: var(--fg); }
.banner.bad { background: var(--bad-soft); color: var(--fg); }
.banner.info { background: var(--accent-soft); color: var(--fg); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 60; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); }
.savechip { font-size: 12px; color: var(--fg-3); display: inline-flex; gap: 5px; align-items: center; }
.savechip.err { color: var(--bad); font-weight: 600; }

/* Charts */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { fill: var(--fg-3); font-size: 11px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--fg-2); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tip { font-size: 13px; color: var(--fg-2); min-height: 18px; }

/* Adviser */
.msgs { display: flex; flex-direction: column; gap: 12px; }
.msg { padding: 12px 14px; border-radius: 16px; max-width: 92%; white-space: pre-wrap; line-height: 1.45; font-size: 15px; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
.msg.ai { align-self: flex-start; background: var(--surface); box-shadow: var(--shadow); border-bottom-left-radius: 6px; }
.verdict { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 18px; padding: 6px 12px; border-radius: 10px; margin-bottom: 8px; }
.verdict.YES { background: var(--accent-soft); color: var(--good); }
.verdict.WAIT { background: var(--warn-soft); color: var(--warn); }
.verdict.NO { background: var(--bad-soft); color: var(--bad); }
.composer { position: sticky; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); background: var(--bg); padding-block: 8px; display: flex; gap: 8px; }
.composer textarea { flex: 1; min-height: 46px; max-height: 120px; }
details > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
pre.ctx { white-space: pre-wrap; font-size: 12px; background: var(--surface-2); padding: 10px; border-radius: 10px; max-height: 260px; overflow: auto; }

.empty { text-align: center; padding: 18px 8px; color: var(--fg-3); font-size: 14px; }
.steps { display: flex; gap: 5px; } .steps i { flex: 1; height: 4px; border-radius: 9px; background: var(--line); } .steps i.on { background: var(--accent); }
.item { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.kv > :nth-child(even) { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
@media (max-width: 360px) { .grid3 { grid-template-columns: 1fr 1fr; } }
</style>
<div id="root"><div style="padding:40px 16px;text-align:center;color:#7d8983">Opening Finance OS…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/* Finance OS — calculation core. Pure functions only (no DOM, no storage),
   so the same file runs in the page and under Node for tests. */
(function (root) {
  'use strict';

  const DEFAULT_CATEGORIES = [
    'Rent', 'Groceries', 'Food & Dining', 'Transportation', 'Shopping',
    'Entertainment', 'Bills & Utilities', 'Medical', 'Travel', 'EMIs',
    'Credit Card Payments', 'Investments', 'Subscriptions', 'Personal', 'Other',
  ];
  const INCOME_CATEGORIES = ['Salary', 'Freelance', 'Bonus', 'From friends', 'Reimbursement', 'Other income'];
  const METHODS = ['UPI', 'Cash', 'HDFC Credit Card', 'Other Credit Card', 'Bank Transfer', 'Other'];
  const CARD_METHODS = ['HDFC Credit Card', 'Other Credit Card'];
  // Categories that move money but are not consumption.
  const CARD_PAYMENT = 'Credit Card Payments';
  const INVESTMENT = 'Investments';
  const ASSET_TYPES = ['Bank savings', 'Emergency fund', 'Fixed deposit', 'Mutual funds', 'Stocks', 'Other investment'];

  // ---------- dates ----------
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
  const monthKey = (s) => String(s).slice(0, 7);
  const daysInMonth = (y, m0) => new Date(y, m0 + 1, 0).getDate();
  const addMonths = (s, n) => {
    const d = parse(s); const day = d.getDate();
    const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
    t.setDate(Math.min(day, daysInMonth(t.getFullYear(), t.getMonth())));
    return iso(t);
  };
  const shiftMonthKey = (mk, n) => addMonths(mk + '-01', n).slice(0, 7);
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  /** The next date (>= today) falling on day-of-month `day`. */
  const nextOnDay = (today, day) => {
    const t = parse(today);
    const clamp = (y, m) => Math.min(day, daysInMonth(y, m));
    let d = new Date(t.getFullYear(), t.getMonth(), clamp(t.getFullYear(), t.getMonth()));
    if (d < t) { const y = t.getFullYear(), m = t.getMonth() + 1; d = new Date(y, m, clamp(y, m)); }
    return iso(d);
  };

  const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  const sum = (arr, f) => arr.reduce((a, x) => a + num(f ? f(x) : x), 0);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // ---------- transaction semantics ----------
  const isCardMethod = (m) => CARD_METHODS.includes(m);
  /** Counts as spending: an expense that is not a card-bill payment or an investment. */
  const isSpend = (t) => t.type === 'expense' && t.category !== CARD_PAYMENT && t.category !== INVESTMENT;
  /** The part of a spend that is mine (shared bills: others' share is a receivable). */
  const myShare = (t) => Math.max(0, num(t.amount) - num(t.othersOwe));
  /** Cash leaving the bank account (card purchases leave later, via the bill payment). */
  const bankOut = (t) => t.type === 'expense' && !isCardMethod(t.method) ? num(t.amount) : 0;
  const bankIn = (t) => t.type === 'income' ? num(t.amount) : 0;

  /** Did `t` happen after a manual figure entered on `asOf` (ms timestamp `ts` breaks same-day ties)? */
  const isAfter = (t, asOf, ts) => t.date > asOf || (t.date === asOf && ts != null && (t.createdAt || 0) > ts);

  function monthTx(txs, mk) { return txs.filter((t) => monthKey(t.date) === mk); }

  function monthSummary(txs, mk) {
    const list = monthTx(txs, mk);
    const income = sum(list.filter((t) => t.type === 'income'), (t) => t.amount);
    const spend = sum(list.filter(isSpend), myShare);
    const invested = sum(list.filter((t) => t.type === 'expense' && t.category === INVESTMENT), (t) => t.amount);
    const cardPaid = sum(list.filter((t) => t.type === 'expense' && t.category === CARD_PAYMENT), (t) => t.amount);
    const net = income - spend;
    return { mk, income, spend, invested, cardPaid, net, savingsRate: income > 0 ? net / income : null, count: list.length };
  }

  function byKey(list, keyFn, valFn) {
    const m = new Map();
    for (const t of list) { const k = keyFn(t); m.set(k, (m.get(k) || 0) + valFn(t)); }
    return [...m.entries()].map(([k, v]) => ({ k, v })).sort((a, b) => b.v - a.v);
  }

  // ---------- cards ----------
  /** Outstanding = balance entered at `asOf` + card purchases after it − bill payments after it. */
  function cardOutstanding(card, txs) {
    const after = txs.filter((t) => t.cardId === card.id && isAfter(t, card.asOf || '0000', card.asOfTs));
    const purchases = sum(after.filter((t) => t.type === 'expense' && t.category !== CARD_PAYMENT), (t) => t.amount);
    const refunds = sum(after.filter((t) => t.type === 'income'), (t) => t.amount);
    const paid = sum(after.filter((t) => t.type === 'expense' && t.category === CARD_PAYMENT), (t) => t.amount);
    return Math.max(0, num(card.outstanding) + purchases - refunds - paid);
  }

  // ---------- IOUs ----------
  const iouPaid = (x) => sum(x.payments || [], (p) => p.amount);
  const iouLeft = (x) => Math.max(0, num(x.amount) - iouPaid(x));
  const iouStatus = (x, today) => {
    const left = iouLeft(x);
    if (left <= 0) return 'Settled';
    if (iouPaid(x) > 0) return 'Partly paid';
    const due = x.expected || x.due;
    if (due && due < today) return 'Overdue';
    return 'Open';
  };

  // ---------- bank balance ----------
  /** Bank balance: the last manual figure, rolled forward by everything recorded after it. */
  function bankBalance(s, txs) {
    const asOf = s.bank && s.bank.asOf;
    if (!asOf || s.bank.amount === '' || s.bank.amount == null) return null;
    const after = txs.filter((t) => isAfter(t, asOf, s.bank.asOfTs));
    let bal = num(s.bank.amount) + sum(after, bankIn) - sum(after, bankOut);
    for (const x of s.lent || []) {
      if (!x.txId && x.date > asOf) bal -= num(x.amount);
      bal += sum((x.payments || []).filter((p) => p.date > asOf), (p) => p.amount);
    }
    for (const x of s.borrowed || []) {
      if (x.date && x.date > asOf) bal += num(x.amount);
      bal -= sum((x.payments || []).filter((p) => p.date > asOf), (p) => p.amount);
    }
    return bal;
  }

  // ---------- obligations ----------
  function nextPayday(s, today) { return nextOnDay(today, num(s.income && s.income.payday) || 1); }

  /** Was a fixed bill already paid this month? Match by category or name, ±15% amount. */
  function fixedPaid(f, txs, mk) {
    return monthTx(txs, mk).some((t) => t.type === 'expense' &&
      (t.fixedId === f.id || ((t.category === f.category || (t.name || '').toLowerCase() === (f.name || '').toLowerCase()) &&
        Math.abs(num(t.amount) - num(f.amount)) <= num(f.amount) * 0.15)));
  }

  /** Everything that must be paid from now until (and excluding) `until`. */
  function obligations(s, txs, today, until) {
    const out = [];
    const mk = monthKey(today);
    for (const f of s.fixed || []) {
      if (!num(f.amount)) continue;
      const due = nextOnDay(today, num(f.dueDay) || 1);
      const dueThisMonth = monthKey(due) === mk;
      if (dueThisMonth && fixedPaid(f, txs, mk)) continue;
      if (due < until) out.push({ kind: 'Bill', name: f.name, amount: num(f.amount), date: due });
    }
    for (const l of s.loans || []) {
      if (!num(l.emi) || num(l.remainingEmis) <= 0 || !l.nextDate) continue;
      if (l.nextDate < until) out.push({ kind: 'EMI', name: l.lender, amount: num(l.emi), date: l.nextDate < today ? today : l.nextDate, overdue: l.nextDate < today });
    }
    for (const c of s.cards || []) {
      const owed = cardOutstanding(c, txs);
      if (owed <= 0 || !num(c.dueDay)) continue;
      const due = nextOnDay(today, num(c.dueDay));
      // Statement amount if entered, otherwise everything outstanding (conservative).
      const amt = Math.min(owed, num(c.totalDue) > 0 ? num(c.totalDue) : owed);
      if (due < until) out.push({ kind: 'Card', name: c.bank, amount: amt, date: due, minDue: num(c.minDue) });
    }
    for (const p of s.planned || []) {
      if (!p.done && p.date >= today && p.date < until) out.push({ kind: 'Planned', name: p.name, amount: num(p.amount), date: p.date });
    }
    for (const b of s.borrowed || []) {
      const left = iouLeft(b);
      if (left > 0 && b.due && b.due < until) out.push({ kind: 'Owe', name: b.person, amount: left, date: b.due < today ? today : b.due });
    }
    return out.sort((a, b) => a.date.localeCompare(b.date));
  }

  /** Money still to set aside this month to meet the monthly savings target. */
  function savingsStillToSet(s, txs, today) {
    const target = num(s.savingsTarget && s.savingsTarget.monthly);
    if (!target) return 0;
    const done = monthSummary(txs, monthKey(today)).invested;
    return Math.max(0, target - done);
  }

  /**
   * SAFE TO SPEND: bank balance until next payday, after every bill, EMI, card
   * due, planned expense and debt falling before payday, the rest of this

  function safeToSpend(s, txs, today) {
    const bank = bankBalance(s, txs);
    const payday = nextPayday(s, today);
    const obs = obligations(s, txs, today, payday === today ? addMonths(today, 1) : payday);
    const due = sum(obs, (o) => o.amount);
    const savings = savingsStillToSet(s, txs, today);
    const cushion = num(s.cushion);
    const missing = [];
    if (bank == null) missing.push('current bank balance');
    if (!num(s.income && s.income.salary)) missing.push('monthly salary');
    const raw = bank == null ? null : bank - due - savings - cushion;
    const days = Math.max(1, daysBetween(today, payday) || daysInMonth(parse(today).getFullYear(), parse(today).getMonth()));
    return {
      bank, payday, obligations: obs, due, savings, cushion, missing,
      safe: raw == null ? null : Math.max(0, raw), shortfall: raw != null && raw < 0 ? -raw : 0,
      perDay: raw == null ? null : Math.max(0, raw) / days, days,

  }

  // ---------- budgets ----------
  function budgetStatus(s, txs, mk) {
    const spent = new Map(byKey(monthTx(txs, mk).filter(isSpend), (t) => t.category, myShare).map((x) => [x.k, x.v]));
    const rows = Object.entries(s.budgets || {}).filter(([, v]) => num(v) > 0).map(([cat, v]) => {
      const used = spent.get(cat) || 0; const pct = used / num(v);
      return { cat, budget: num(v), spent: used, left: num(v) - used, pct, level: pct >= 1 ? 100 : pct >= 0.9 ? 90 : pct >= 0.75 ? 75 : 0 };
    }).sort((a, b) => b.pct - a.pct);
    const total = sum(rows, (r) => r.budget);
    const used = sum(rows, (r) => r.spent);
    const unbudgeted = [...spent.entries()].filter(([c]) => !(num((s.budgets || {})[c]) > 0)).map(([cat, v]) => ({ cat, spent: v }));
    return { rows, total, used, left: total - used, pct: total ? used / total : null, unbudgeted };
  }

  // ---------- net worth ----------
  function netWorth(s, txs) {
    const bank = bankBalance(s, txs) || 0;
    const assets = s.assets || [];
    const assetValue = sum(assets, (a) => a.current !== '' && a.current != null ? a.current : a.invested);
    const invested = sum(assets, (a) => a.invested);
    const sip = sum(assets, (a) => a.sip);
    const receivable = sum(s.lent || [], iouLeft);
    const loanDebt = sum(s.loans || [], (l) => l.outstanding);
    const cardDebt = sum(s.cards || [], (c) => cardOutstanding(c, txs));
    const owe = sum(s.borrowed || [], iouLeft);
    const totalAssets = bank + assetValue + receivable;
    const liabilities = loanDebt + cardDebt + owe;
    const emergency = sum(assets.filter((a) => a.type === 'Emergency fund'), (a) => a.current || a.invested);
    const savings = sum(assets.filter((a) => a.type === 'Bank savings' || a.type === 'Emergency fund' || a.type === 'Fixed deposit'), (a) => a.current || a.invested);
    return { bank, assetValue, invested, sip, receivable, loanDebt, cardDebt, owe, totalAssets, liabilities, net: totalAssets - liabilities, emergency, savings, emiTotal: sum((s.loans || []).filter((l) => num(l.remainingEmis) > 0), (l) => l.emi) };

  // ---------- coaching (deterministic) ----------

    const out = [];

    const dayOfMonth = parse(today).getDate(); const dim = daysInMonth(parse(today).getFullYear(), parse(today).getMonth());
    // Pace vs last month.

      out.push({ tone: 'warn', title: 'Spending faster than last month', body: 'You have spent ' + fmt(cur.spend) + ' in ' + dayOfMonth + ' days. At this pace the month ends near ' + fmt(cur.spend / dayOfMonth * dim) + ' against ' + fmt(prev.spend) + ' last month.' });
    }
    // Budgets.
    for (const r of budgetStatus(s, txs, mk).rows) {
      if (r.level >= 100) out.push({ tone: 'bad', title: r.cat + ' budget used up', body: fmt(r.spent) + ' spent of ' + fmt(r.budget) + ' (' + Math.round(r.pct * 100) + '%).' });
      else if (r.level >= 75) out.push({ tone: 'warn', title: r.cat + ' at ' + Math.round(r.pct * 100) + '%', body: fmt(r.left) + ' left for the rest of the month.' });
    }
    // Repeated small expenses (last 30 days, same merchant, < ₹500, 4+ times).
    const since = addMonths(today, -1);
    const small = txs.filter((t) => isSpend(t) && t.date > since && num(t.amount) < 500 && t.name);
    for (const m of byKey(small, (t) => t.name.trim().toLowerCase(), () => 1).filter((x) => x.v >= 4).slice(0, 3)) {
      const total = sum(small.filter((t) => t.name.trim().toLowerCase() === m.k), (t) => t.amount);
      out.push({ tone: 'info', title: 'Small repeats: ' + m.k, body: m.v + ' purchases in 30 days, ' + fmt(total) + ' in total. About ' + fmt(total * 12) + ' a year at this rate.' });
    }
    // Biggest category jump vs last month.
    const prevCat = new Map(byKey(monthTx(txs, shiftMonthKey(mk, -1)).filter(isSpend), (t) => t.category, myShare).map((x) => [x.k, x.v]));
    for (const c of byKey(monthTx(txs, mk).filter(isSpend), (t) => t.category, myShare).slice(0, 5)) {
      const p = prevCat.get(c.k) || 0;
      if (p > 0 && c.v > p * 1.3 && c.v - p > 1000) out.push({ tone: 'warn', title: c.k + ' up ' + Math.round((c.v / p - 1) * 100) + '% on last month', body: fmt(c.v) + ' so far against ' + fmt(p) + ' in all of last month.' });
    }
    // Savings rate trend.
    if (prev.income > 0 && prev.savingsRate != null) {
      const prev2 = monthSummary(txs, shiftMonthKey(mk, -2));
      if (prev2.income > 0 && prev2.savingsRate != null) {
        const d = prev.savingsRate - prev2.savingsRate;
        out.push({ tone: d >= 0 ? 'good' : 'warn', title: 'Savings rate ' + (d >= 0 ? 'improved' : 'slipped'), body: 'Last month ' + Math.round(prev.savingsRate * 100) + '%, the month before ' + Math.round(prev2.savingsRate * 100) + '%.' });
      }
    }
    // Card utilisation.
    for (const c of s.cards || []) {
      const o = cardOutstanding(c, txs);
      if (num(c.limit) && o / num(c.limit) > 0.3) out.push({ tone: o / num(c.limit) > 0.6 ? 'bad' : 'warn', title: c.bank + ' card at ' + Math.round(o / num(c.limit) * 100) + '% of limit', body: 'Keeping card use under 30% of the limit protects your credit score. Pay the full amount due, not the minimum.' });
    }
    // Emergency fund.
    const nw = netWorth(s, txs);
    const monthlyNeed = (cur.spend > 0 ? Math.max(cur.spend, prev.spend) : prev.spend) || sum(s.fixed || [], (f) => f.amount) + nw.emiTotal;
    if (monthlyNeed > 0 && nw.emergency < monthlyNeed * 3) out.push({ tone: 'warn', title: 'Emergency fund below 3 months', body: fmt(nw.emergency) + ' covers ' + (nw.emergency / monthlyNeed).toFixed(1) + ' months of spending. Aim for ' + fmt(monthlyNeed * 6) + ' (6 months).' });
    return out;
  }

  /** Weekly summary numbers for the last 7 days vs the 7 before. */
  function weekly(txs, today) {
    const a = addDays(today, -6), b = addDays(today, -13);

    const p = txs.filter((t) => isSpend(t) && t.date >= b && t.date < a);
    return { from: a, to: today, spend: sum(w, myShare), prev: sum(p, myShare), top: byKey(w, (t) => t.category, myShare).slice(0, 3), count: w.length };
  }

  // ---------- duplicates ----------
  function findDuplicate(txs, t) {

      (x.name || '').trim().toLowerCase() === name) || null;
  }

  // ---------- money parsing / format ----------
  const inr = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
  function fmt(v, opts) {
    if (v == null || !Number.isFinite(Number(v))) return '—';
    const n = Math.round(Number(v));

    if (n >= 1e5) return s + '₹' + (n / 1e5).toFixed(n >= 1e6 ? 0 : 1) + 'L';

  }
  /** Pull a rupee amount out of free text: "₹8,000", "8k", "1.5 lakh", "15000". */
  function parseAmount(text) {
    const m = String(text).replace(/,/g, '').match(/(?:₹|rs\.?|inr)?\s*(\d+(?:\.\d+)?)\s*(k|thousand|l|lakh|lakhs|lac|cr|crore)?\b/i);
    if (!m) return null;

  }

  /** Purchase check the adviser is given as fixed arithmetic. */
  function purchaseCheck(s, txs, today, amount) {
    const st = safeToSpend(s, txs, today);
    const nw = netWorth(s, txs);
    const after = st.safe == null ? null : st.safe - amount;
    const bankAfter = st.bank == null ? null : st.bank - amount;
    let rule = null;
    if (st.safe != null) {
      if (amount <= st.safe * 0.5) rule = 'YES';
      else if (amount <= st.safe) rule = 'WAIT';
      else rule = 'NO';
    }
    return { amount, safeBefore: st.safe, safeAfter: after, bankAfter, payday: st.payday, dueBeforePayday: st.due, emergencyFund: nw.emergency, ruleOfThumb: rule };
  }

  /** CSV for transactions. */
  function toCSV(txs) {
    const cols = ['date', 'type', 'amount', 'name', 'category', 'method', 'othersOwe', 'notes'];
    const esc = (v) => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return [cols.join(',')].concat([...txs].sort((a, b) => a.date.localeCompare(b.date)).map((t) => cols.map((c) => esc(t[c])).join(','))).join('\n');
  }

  function blankState() {
    return {
      v: 1, setupDone: false,
      bank: { amount: '', asOf: '' },
      income: { salary: 67000, payday: 1, sources: [] },
      fixed: [], loans: [], cards: [], assets: [], goals: [], lent: [], borrowed: [], planned: [],
      budgets: {}, customCategories: [], savingsTarget: { monthly: '' }, cushion: 2000,
    };
  }

  const api = {
    DEFAULT_CATEGORIES, INCOME_CATEGORIES, METHODS, CARD_METHODS, CARD_PAYMENT, INVESTMENT, ASSET_TYPES,
    iso, parse, monthKey, isAfter, addMonths, addDays, shiftMonthKey, daysBetween, daysInMonth, nextOnDay, num, sum, uid,
    isSpend, myShare, isCardMethod, monthTx, monthSummary, byKey, cardOutstanding, iouPaid, iouLeft, iouStatus,
    bankBalance, nextPayday, obligations, safeToSpend, savingsStillToSet, budgetStatus, netWorth, avgMonthlySavings,

<script>
/* Finance OS — storage, shared components and charts. */
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const html = htm.bind(React.createElement);
const C = window.Core;
const today = () => C.iso(new Date());
const MIRROR_KEY = 'financeos.mirror.v1';
const LOCAL_KEY = 'financeos.local.v1';
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const clone = (o) => JSON.parse(JSON.stringify(o));
/** A runtime capability, or null where this view has none (e.g. opened outside Claude). */
const useCap = (name) => (window.claude && window.claude.use ? Promise.resolve(window.claude.use(name)).catch(() => null) : Promise.resolve(null));

/* ===================== Storage =====================
   Cloud mode: the artifact `db`, in this person's private subtree
   data/users/<id>/ — one `profile` doc plus one `tx-YYYY-MM` doc per month.
   Local mode (db unavailable): this browser only, and the app says so. */
function createStore() {
  const listeners = new Set();
  const docs = {};
  const dirty = new Set();
  const queues = {};
  let db = null, uid = null, timer = null;
  const status = { mode: 'starting', loaded: false, confirmed: false, saving: 0, lastSaved: null, error: null, stale: false, failedDocs: [] };
  const emit = () => listeners.forEach((f) => f());

  function mirror() { lsSet(MIRROR_KEY, JSON.stringify({ at: Date.now(), docs })); }

  function lastSavedFromDocs() {
    let m = null;
    for (const d of Object.values(docs)) if (d && d.savedAt && (!m || d.savedAt > m)) m = d.savedAt;
    return m ? new Date(m) : null;
  }

  async function start() {
    let user = null;
    try { db = await useCap('db'); } catch (e) { db = null; }
    try { user = await useCap('user'); } catch (e) { user = null; }
    try { uid = user ? await user.id() : null; } catch (e) { uid = null; }
    if (!db || !uid) return startLocal();

    timer = setTimeout(() => { status.stale = true; emit(); }, 10000);
    db.collection('data/users/' + uid).onSnapshot((snap) => {
      for (const d of snap.docs) if (!dirty.has(d.id)) docs[d.id] = clone(d.data());
      for (const ch of snap.docChanges()) if (ch.type === 'removed' && !dirty.has(ch.doc.id)) delete docs[ch.doc.id];
      status.loaded = true;
      if (!snap.metadata.fromCache) { status.confirmed = true; status.stale = false; clearTimeout(timer); }
      if (!status.lastSaved) status.lastSaved = lastSavedFromDocs();
      emit();
    }, (e) => {
      clearTimeout(timer);
      status.error = 'Your saved data could not be loaded (' + e.code + '). Nothing has been changed. Reopen the app to try again.';
      status.stale = true; emit();

  }

  function startLocal() {
    status.mode = 'local';

  async function setOnce(id, body) {

    catch (e) {

      else throw e;

  async function run(id) {
    const q = queues[id]; q.running = true;
    while (q.pending) {
      const body = q.pending; q.pending = null;
      const waiters = q.waiters; q.waiters = [];
      status.saving++; emit();
      try {
        await setOnce(id, body);
        status.lastSaved = new Date(); status.failedDocs = status.failedDocs.filter((x) => x !== id);
        if (!status.failedDocs.length) status.error = null;
        waiters.forEach((w) => w.res());
      } catch (e) {
        const code = (e && e.code) || 'unknown';
        status.error = code === 'quota_exceeded' ? 'Storage is full. Export a backup, then remove old data.'
          : code === 'invalid_argument' ? 'This account cannot write here (view-only access?). Changes stay on this screen only.'
          : 'Last change was NOT saved (' + code + '). Tap Retry; a copy is kept in this browser meanwhile.';
        if (!status.failedDocs.includes(id)) status.failedDocs.push(id);
        waiters.forEach((w) => w.rej(e));

    if (!status.failedDocs.includes(id)) dirty.delete(id);

      if (ok) { status.lastSaved = new Date(); status.error = null; }
      else status.error = 'This browser refused to save. Export a JSON backup now.';
      dirty.delete(id); emit();
      return ok ? Promise.resolve() : Promise.reject({ code: 'local_failed' });

}
const store = createStore();

/* Running inside the Android app (WebView with a native bridge), not a Claude artifact viewer. */
const IS_APP = !!window.AndroidBridge;

/** Offer a generated file: artifact downloads, else the Android bridge. Resolves a short "saved where" note. */

        method: 'POST', signal: opts.signal,
        headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2026-10-21', 'anthropic-beta': 'server-side-fallback-2026-07-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: 'claude-opus-5-5', max_tokens: 16000, fallbacks: 'default', messages }),
      });
    } catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'network', message: String(e) }; }
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw { code: res.status === 401 ? 'bad_key' : res.status === 429 ? 'rate_limited' : 'api_' + res.status, message: (j.error && j.error.message) || '' };
    if (j.stop_reason === 'refusal') throw { code: 'refusal', message: 'Claude declined to answer this one.' };
    const text = (j.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('');
    return { text, truncated: j.stop_reason === 'max_tokens' };
  };
}

function useStore() {
  const [, force] = useState(0);
  useEffect(() => store.subscribe(() => force((n) => n + 1)), []);
  const profile = store.docs.profile || null;
  const txs = [];
  for (const [id, d] of Object.entries(store.docs)) if (id.startsWith('tx-') && d && Array.isArray(d.items)) txs.push(...d.items);
  txs.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  return { profile, txs, status: store.status };
}

/* Data actions — each one saves immediately. */
const monthDoc = (mk) => store.docs['tx-' + mk] || { items: [] };
function saveProfile(p) { return store.write('profile', p); }
async function saveTx(t, profile) {
  const mk = C.monthKey(t.date);
  const old = findTx(t.id);
  const writes = [];
  if (old && C.monthKey(old.date) !== mk) {
    const om = C.monthKey(old.date);
    writes.push(store.write('tx-' + om, { items: monthDoc(om).items.filter((x) => x.id !== t.id) }));
  }
  const items = monthDoc(mk).items.filter((x) => x.id !== t.id).concat([t]);
  writes.push(store.write('tx-' + mk, { items }));
  // Shared bill: others' share becomes money owed to me.
  if (profile) {
    let lent = (profile.lent || []).slice();
    const i = lent.findIndex((x) => x.txId === t.id);
    if (C.num(t.othersOwe) > 0) {
      const entry = Object.assign({ id: C.uid(), payments: [], expected: '' }, i >= 0 ? lent[i] : {}, { txId: t.id, person: t.owedBy || 'Friends', amount: C.num(t.othersOwe), date: t.date, notes: 'Share of ' + (t.name || t.category) });
      if (i >= 0) lent[i] = entry; else lent.push(entry);
      writes.push(saveProfile(Object.assign({}, profile, { lent })));
    } else if (i >= 0 && !(lent[i].payments || []).length) {
      lent.splice(i, 1); writes.push(saveProfile(Object.assign({}, profile, { lent })));
    }
  }
  return Promise.all(writes);
}
function findTx(id) {
  for (const [k, d] of Object.entries(store.docs)) if (k.startsWith('tx-') && d && d.items) { const t = d.items.find((x) => x.id === id); if (t) return t; }
  return null;
}
function deleteTx(t, profile) {
  const mk = C.monthKey(t.date);
  const w = [store.write('tx-' + mk, { items: monthDoc(mk).items.filter((x) => x.id !== t.id) })];
  if (profile) {
    const lent = (profile.lent || []).filter((x) => !(x.txId === t.id && !(x.payments || []).length));
    if (lent.length !== (profile.lent || []).length) w.push(saveProfile(Object.assign({}, profile, { lent })));
  }
  return Promise.all(w);
}

function cardsFromEdit(draft, cards, txs) {

function CashflowChart({ months, onPick, picked }) {
  const W = 340, H = 170, top = 10, bottom = 22, left = 34;
  const max = Math.max(1, ...months.map((m) => Math.max(m.income, m.spend)));
  const nice = niceMax(max);
  const gw = (W - left) / months.length, bw = Math.min(16, gw / 3);
  const y = (v) => top + (H - top - bottom) * (1 - v / nice);
  return html`<svg className="chart" viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label="Income versus spending by month">
    ${[0, 0.5, 1].map((f) => html`<g key=${f}><line className="grid" x1=${left} x2=${W} y1=${y(nice * f)} y2=${y(nice * f)} /><text x=${left - 6} y=${y(nice * f) + 4} text-anchor="end">${C.fmtShort(nice * f).replace('₹', '')}</text></g>`)}
    ${months.map((m, i) => {
      const x = left + gw * i + gw / 2;
      const on = picked === m.mk;
      return html`<g key=${m.mk} onClick=${() => onPick && onPick(m.mk)} style=${{ cursor: 'pointer' }}>
        <rect x=${left + gw * i} y=${top} width=${gw} height=${H - top - bottom} fill=${on ? 'var(--surface-2)' : 'transparent'} rx="6" />
        <path d=${barPath(x - bw - 1, y(m.income), bw, y(0))} fill="var(--c-income)" />
        <path d=${barPath(x + 1, y(m.spend), bw, y(0))} fill="var(--c-spend)" />
        <text x=${x} y=${H - 6} text-anchor="middle" style=${{ fontWeight: on ? 700 : 400 }}>${monthName(m.mk)}</text>
      </g>`;
    })}
  </svg>`;
}
function barPath(x, yTop, w, yBase) {
  const h = Math.max(0, yBase - yTop); if (h < 0.5) return '';
  const r = Math.min(4, w / 2, h);
  return 'M' + x + ',' + yBase + 'V' + (yTop + r) + 'Q' + x + ',' + yTop + ' ' + (x + r) + ',' + yTop + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + yTop + ' ' + (x + w) + ',' + (yTop + r) + 'V' + yBase + 'Z';
}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }

  const W = 340, H = 120, top = 6, bottom = 18, left = 2;

function HBars({ rows, total, limit, empty }) {

  if (!list.length) return html`<div className="empty">${empty || 'Nothing recorded yet.'}</div>`;
  return html`<div className="stack">${list.map((r) => html`<div key=${r.k} className="stack" style=${{ gap: '5px' }}>
    <div className="row small"><span className="grow ellipsis" style=${{ fontWeight: 600 }}>${r.k}</span><span className="num">${fmt(r.v)}</span><span className="muted num" style=${{ width: '38px', textAlign: 'right' }}>${total ? Math.round(r.v / total * 100) + '%' : ''}</span></div>
    <div className="bar"><i style=${{ width: (r.v / max * 100) + '%' }}></i></div>
  </div>`)}</div>`;
}

function allCategories(p) { return C.DEFAULT_CATEGORIES.concat((p && p.customCategories) || []); }
function monthsWithData(txs) {
  const set = new Set(txs.map((t) => C.monthKey(t.date))); set.add(C.monthKey(today()));
  return [...set].sort().reverse();
}
function healthScore(p, txs, d) {
  const mk = C.monthKey(d); const prev = C.monthSummary(txs, C.shiftMonthKey(mk, -1)); const cur = C.monthSummary(txs, mk);
  const nw = C.netWorth(p, txs); const inc = C.num(p.income && p.income.salary) + C.sum((p.income && p.income.sources) || [], (s) => s.amount);
  const base = prev.income > 0 ? prev : cur;
  const parts = [];
  const sr = base.savingsRate; parts.push({ k: 'Savings rate', got: sr == null ? null : Math.round(Math.max(0, Math.min(1, sr / 0.3)) * 30), of: 30, note: sr == null ? 'record income to score' : pct(sr) + ' (30%+ is full marks)' });
  const need = Math.max(base.spend, C.sum(p.fixed || [], (f) => f.amount) + nw.emiTotal);
  const em = need > 0 ? nw.emergency / need : null; parts.push({ k: 'Emergency fund', got: em == null ? null : Math.round(Math.min(1, em / 6) * 25), of: 25, note: em == null ? 'add expenses to score' : em.toFixed(1) + ' months (6 is full marks)' });
  const dti = inc > 0 ? nw.emiTotal / inc : null; parts.push({ k: 'EMI load', got: dti == null ? null : Math.round(Math.max(0, Math.min(1, (0.4 - dti) / 0.3)) * 20), of: 20, note: dti == null ? 'set salary to score' : pct(dti) + ' of income on EMIs (10% or less is full marks)' });
  const lim = C.sum(p.cards || [], (c) => c.limit); const util = lim > 0 ? nw.cardDebt / lim : null;
  parts.push({ k: 'Card use', got: util == null ? (p.cards || []).length ? null : 15 : Math.round(Math.max(0, Math.min(1, (0.9 - util) / 0.6)) * 15), of: 15, note: util == null ? (p.cards || []).length ? 'add card limits to score' : 'no cards' : pct(util) + ' of limits (30% or less is full marks)' });
  const b = C.budgetStatus(p, txs, mk); const over = b.rows.filter((r) => r.pct >= 1).length;
  parts.push({ k: 'Budgets', got: b.rows.length ? Math.round(10 * (1 - over / b.rows.length)) : null, of: 10, note: b.rows.length ? over + ' of ' + b.rows.length + ' over budget' : 'set budgets to score' });
  const scored = parts.filter((x) => x.got != null);
  const score = scored.length ? Math.round(C.sum(scored, (x) => x.got) / C.sum(scored, (x) => x.of) * 100) : null;
  return { score, parts };
}

function SaveChip({ status }) {
  if (status.mode === 'starting') return html`<span className="savechip">Connecting…</span>`;
  if (status.error) return html`<span className="savechip err">Not saved</span>`;
  if (status.saving) return html`<span className="savechip">Saving…</span>`;
  const t = status.lastSaved;
  const where = status.mode === 'cloud' ? 'Saved' : 'Saved on this device';
  return html`<span className="savechip">${t ? where + ' ' + t.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) : status.mode === 'cloud' ? 'Synced' : 'This device only'}</span>`;
}

/* ===================== Add / edit transaction ===================== */
function AddSheet({ p, txs, initial, onClose, toast }) {
  const editing = !!(initial && initial.id);
  const lastMethod = lsGet('financeos.lastMethod') || 'UPI';
  const [t, setT] = useState(() => Object.assign({ type: 'expense', amount: '', name: '', category: '', date: today(), method: lastMethod, notes: '', othersOwe: '', owedBy: '', cardId: '' }, initial || {}));
  const [touchedCat, setTouchedCat] = useState(editing || !!(initial && initial.category));
  const [more, setMore] = useState(!!(initial && (initial.notes || initial.othersOwe)));
  const [dup, setDup] = useState(null);
  const [confirmDel, setConfirmDel] = useState(false);
  const [newCat, setNewCat] = useState(null);
  const [busy, setBusy] = useState(false);
  const amtRef = useRef();
  useEffect(() => { if (!editing && amtRef.current) amtRef.current.focus(); }, []);
  const set = (k, v) => { setT((o) => Object.assign({}, o, { [k]: v })); setDup(null); };

  const expenseCats = useMemo(() => {
    const freq = C.byKey(txs.filter((x) => x.type === 'expense'), (x) => x.category, () => 1).map((x) => x.k);
    return [...new Set(freq.concat(allCategories(p)))].filter((c) => allCategories(p).includes(c));
  }, [txs.length, p.customCategories]);
  const cats = t.type === 'income' ? C.INCOME_CATEGORIES : expenseCats;
  const names = useMemo(() => [...new Set(txs.slice(0, 300).map((x) => x.name).filter(Boolean))], [txs.length]);
  const onName = (v) => {
    set('name', v);
    const prev = txs.find((x) => (x.name || '').toLowerCase() === v.trim().toLowerCase());
    if (prev && !touchedCat) setT((o) => Object.assign({}, o, { name: v, category: prev.category, method: prev.method, type: prev.type, cardId: prev.cardId || '' }));
  };
  const isCardPay = t.type === 'expense' && t.category === C.CARD_PAYMENT;
  const cardsForMethod = (p.cards || []).filter((c) => c.method === t.method);
  const showCardPick = isCardPay ? (p.cards || []).length > 0 : C.isCardMethod(t.method) && (p.cards || []).length > 0;
  const cardChoices = isCardPay ? (p.cards || []) : (cardsForMethod.length ? cardsForMethod : (p.cards || []));
  const cardId = showCardPick ? (cardChoices.some((c) => c.id === t.cardId) ? t.cardId : (cardChoices[0] && cardChoices[0].id) || '') : '';

  async function save(force) {
    const amount = C.num(t.amount);
    if (!(amount > 0)) { toast('Enter an amount'); return; }
    const category = t.category || (t.type === 'income' ? 'Other income' : 'Other');
    const rec = Object.assign({}, t, { amount, category, name: t.name.trim(), cardId: cardId || '', othersOwe: C.num(t.othersOwe) || '', id: t.id || C.uid(), createdAt: t.createdAt || Date.now() });
    if (rec.type === 'income') { rec.othersOwe = ''; rec.owedBy = ''; }
    if (!force) { const d = C.findDuplicate(txs, rec); if (d) { setDup(d); return; } }
    const mk = C.monthKey(rec.date);
    const before = C.budgetStatus(p, txs, mk).rows.find((r) => r.cat === rec.category);
    setBusy(true);
    lsSet('financeos.lastMethod', rec.method);
    try {
      await saveTx(rec, p);
      const after = C.budgetStatus(p, txs.filter((x) => x.id !== rec.id).concat([rec]), mk).rows.find((r) => r.cat === rec.category);
      if (after && after.level > (before ? before.level : 0)) toast(after.level >= 100 ? '⚠ ' + rec.category + ' is over budget (' + pct(after.pct) + ')' : rec.category + ' budget at ' + pct(after.pct));
      else toast((editing ? 'Updated · ' : 'Saved · ') + fmt(amount) + (rec.name ? ' ' + rec.name : ''));
      onClose();
    } catch (e) { toast('Not saved: ' + ((e && e.code) || 'error') + '. Kept on screen; tap Retry in Settings.'); setBusy(false); onClose(); }
  }
  async function del() {
    setBusy(true);
    try { await deleteTx(t, p); toast('Deleted'); } catch (e) { toast('Delete not saved: ' + ((e && e.code) || 'error')); }
    onClose();
  }
  async function addCategory() {
    const name = (newCat || '').trim(); if (!name) return;
    if (!allCategories(p).includes(name)) await saveProfile(Object.assign({}, p, { customCategories: (p.customCategories || []).concat([name]) }));
    set('category', name); setTouchedCat(true); setNewCat(null);
  }

  return html`<${Sheet} title=${editing ? 'Edit transaction' : 'Add transaction'} onClose=${onClose}>
    <${Seg} value=${t.type} onChange=${(v) => { set('type', v); set('category', ''); setTouchedCat(false); }} options=${[{ v: 'expense', l: 'Expense' }, { v: 'income', l: 'Income' }]} />
    <label className="amount-in" htmlFor="tx-amount"><span>₹</span><input id="tx-amount" ref=${amtRef} inputMode="decimal" placeholder="0" className="num" value=${t.amount} onChange=${(e) => set('amount', e.target.value.replace(/[^\d.]/g, ''))} onKeyDown=${(e) => { if (e.key === 'Enter') save(false); }} /></label>
    <${Field} label=${t.type === 'income' ? 'From' : 'Paid to (merchant or person)'}>
      <input id="tx-name" className="input" list="names" autoComplete="off" placeholder=${t.type === 'income' ? 'Employer, client, friend…' : 'Swiggy, landlord, Rahul…'} value=${t.name} onChange=${(e) => onName(e.target.value)} />
      <datalist id="names">${names.map((n) => html`<option key=${n} value=${n} />`)}</datalist>
    </${Field}>
    <div className="field"><span className="lbl">Category</span>
      <div className="chips wrap">${cats.map((c) => html`<button key=${c} className=${'chip' + (t.category === c ? ' on' : '')} onClick=${() => { set('category', c); setTouchedCat(true); }}>${c}</button>`)}
        ${t.type === 'expense' ? (newCat == null ? html`<button className="chip" onClick=${() => setNewCat('')}>+ New</button>`
          : html`<span className="row" style=${{ flexBasis: '100%' }}><input id="tx-newcat" className="input grow" placeholder="New category name" value=${newCat} onChange=${(e) => setNewCat(e.target.value)} /><button className="btn sm primary" onClick=${addCategory}>Add</button></span>`) : null}
      </div></div>
    <div className="field"><span className="lbl">Paid with</span>
      <div className="chips">${C.METHODS.map((m) => html`<button key=${m} className=${'chip' + (t.method === m ? ' on' : '')} onClick=${() => set('method', m)}>${m}</button>`)}</div></div>
    ${showCardPick && cardChoices.length > 1 || isCardPay ? html`<${Field} label=${isCardPay ? 'Paying which card?' : 'Which card?'}>
      <select id="tx-card" className="input" value=${cardId} onChange=${(e) => set('cardId', e.target.value)}>${cardChoices.map((c) => html`<option key=${c.id} value=${c.id}>${c.bank}</option>`)}</select></${Field}>` : null}
    ${isCardPay && !(p.cards || []).length ? html`<div className="banner warn small">Add the card under Health → Debts so this payment reduces its balance.</div>` : null}
    ${isCardPay ? html`<div className="small muted">Bill payments reduce what you owe on the card. They are not counted as spending, because the purchases already were.</div>` : null}
    ${C.isCardMethod(t.method) && !isCardPay && t.type === 'expense' ? html`<div className="small muted">Counts as spending now; leaves your bank account when you pay the card bill.</div>` : null}
    <div className="grid2">
      <${Field} label="Date"><input id="tx-date" className="input" type="date" value=${t.date} onChange=${(e) => set('date', e.target.value)} /></${Field}>
      <div className="field"><span className="lbl">Quick</span><div className="row"><button className="chip" onClick=${() => set('date', today())}>Today</button><button className="chip" onClick=${() => set('date', C.addDays(today(), -1))}>Yesterday</button></div></div>
    </div>
    ${more ? html`<div className="stack">
      <${Field} label="Notes"><textarea id="tx-notes" className="input" value=${t.notes} onChange=${(e) => set('notes', e.target.value)}></textarea></${Field}>
      ${t.type === 'expense' ? html`<div className="grid2">
        <${Field} label="Others owe me (shared bill)"><${NumInput} id="tx-owe" value=${t.othersOwe} onChange=${(v) => set('othersOwe', v)} /></${Field}>
        <${Field} label="Who owes it"><input id="tx-owedby" className="input" value=${t.owedBy} placeholder="Name" onChange=${(e) => set('owedBy', e.target.value)} /></${Field}>
      </div><div className="small muted">Only your share counts as spending; the rest is added to Money owed to me.</div>` : null}
    </div>` : html`<button className="link" style=${{ alignSelf: 'flex-start' }} onClick=${() => setMore(true)}>+ Notes or split with friends</button>`}
    ${dup ? html`<div className="banner warn"><div className="grow">This looks like a duplicate of ${dup.name || dup.category} · ${fmt(dup.amount)} on ${shortDate(dup.date)}.</div><button className="btn sm" onClick=${() => save(true)}>Save anyway</button></div>` : null}
    <button className="btn primary block" disabled=${busy} onClick=${() => save(false)}>${editing ? 'Save changes' : 'Save'}</button>
    ${editing ? (confirmDel ? html`<div className="row"><span className="grow small">Delete this transaction?</span><button className="btn sm" onClick=${() => setConfirmDel(false)}>Keep</button><button className="btn sm danger" onClick=${del}>Delete</button></div>`
      : html`<button className="btn danger block" onClick=${() => setConfirmDel(true)}>Delete</button>`) : null}
  </${Sheet}>`;
}

        <select id="act-method" className="input" value=${method} onChange=${(e) => setMethod(e.target.value)}><option value="">All methods</option>${C.METHODS.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}</select>

function Analytics({ p, txs, mk }) {
  const list = C.monthTx(txs, mk); const spend = list.filter(C.isSpend);
  const m = C.monthSummary(txs, mk); const prev = C.monthSummary(txs, C.shiftMonthKey(mk, -1));
  const cats = C.byKey(spend, (t) => t.category, C.myShare);
  const prevCats = new Map(C.byKey(C.monthTx(txs, C.shiftMonthKey(mk, -1)).filter(C.isSpend), (t) => t.category, C.myShare).map((x) => [x.k, x.v]));
  const merchants = C.byKey(spend.filter((t) => t.name), (t) => t.name.trim(), C.myShare);
  const methods = C.byKey(list.filter((t) => t.type === 'expense'), (t) => t.method, (t) => t.amount);
  const weeks = [1, 8, 15, 22, 29].map((d0, i) => ({ k: 'Week ' + (i + 1) + ' (' + d0 + '–' + Math.min(d0 + 6, C.daysInMonth(C.parse(mk + '-01').getFullYear(), C.parse(mk + '-01').getMonth())) + ')', v: C.sum(spend.filter((t) => { const d = C.parse(t.date).getDate(); return d >= d0 && d < d0 + 7; }), C.myShare) })).filter((w, i) => i < 4 || w.v > 0);
  const six = [-5, -4, -3, -2, -1, 0].map((i) => C.monthSummary(txs, C.shiftMonthKey(mk, i)));
  const [picked, setPicked] = useState(mk);
  const pm = six.find((x) => x.mk === picked) || six[5];
  const delta = prev.spend ? (m.spend - prev.spend) / prev.spend : null;
  return html`<${React.Fragment}>
    <div className="grid3">
      <div className="stat"><span className="k">Spent</span><span className="v num">${C.fmtShort(m.spend)}</span><span className="s">${delta == null ? '—' : (delta >= 0 ? '▲ ' : '▼ ') + Math.abs(Math.round(delta * 100)) + '% vs prev'}</span></div>
      <div className="stat"><span className="k">Income</span><span className="v num">${C.fmtShort(m.income)}</span><span className="s">${m.count} transactions</span></div>
      <div className="stat"><span className="k">Saved</span><span className="v num">${pct(m.savingsRate)}</span><span className="s num">${fmt(m.net)}</span></div>
    </div>
    <div className="card"><h2>Daily spending</h2><${DailyBars} mk=${mk} txs=${txs} /></div>
    <div className="card"><h2>Weekly spending</h2><${HBars} rows=${weeks} total=${m.spend} /></div>
    <div className="card"><h2>By category · vs last month</h2>
      ${cats.length ? html`<div className="stack">${cats.map((c) => { const pv = prevCats.get(c.k) || 0; const ch = pv ? (c.v - pv) / pv : null; return html`<div key=${c.k} className="stack" style=${{ gap: '5px' }}>
        <div className="row small"><span className="grow ellipsis" style=${{ fontWeight: 600 }}>${c.k}</span><span className="num">${fmt(c.v)}</span>
          <span className=${'num ' + (ch == null ? 'muted' : '')} style=${{ width: '64px', textAlign: 'right', color: ch == null ? undefined : ch > 0.1 ? 'var(--bad)' : ch < -0.1 ? 'var(--good)' : 'var(--fg-3)' }}>${ch == null ? 'new' : (ch >= 0 ? '+' : '') + Math.round(ch * 100) + '%'}</span></div>
        <div className="bar"><i style=${{ width: (c.v / cats[0].v * 100) + '%' }}></i></div></div>`; })}</div>` : html`<div className="empty">No spending in ${monthName(mk, true)}.</div>`}
    </div>
    <div className="card"><h2>Top merchants & people</h2><${HBars} rows=${merchants} total=${m.spend} limit=${8} /></div>
    <div className="card"><h2>Payment methods</h2><${HBars} rows=${methods} total=${C.sum(methods, (x) => x.v)} /><div className="small muted" style=${{ marginTop: '8px' }}>Includes card-bill payments and investments, so the total can exceed spending.</div></div>
    <div className="card"><h2>Income vs spending · 6 months</h2>
      <div className="legend"><span><i style=${{ background: 'var(--c-income)' }}></i>Income</span><span><i style=${{ background: 'var(--c-spend)' }}></i>Spending</span></div>
      <${CashflowChart} months=${six} picked=${picked} onPick=${setPicked} />
      <div className="tip num">${monthName(pm.mk, true)}: income ${fmt(pm.income)}, spending ${fmt(pm.spend)}</div></div>
    <div className="card"><h2>Savings trend</h2><${TrendLine} points=${six.map((x) => ({ mk: x.mk, v: x.net, rate: x.savingsRate }))} />
      <div className="small muted">Net savings = income − spending. Investments count as saved, not spent.</div></div>
  </${React.Fragment}>`;
}

/* ===================== Budgets & income ===================== */
function Budgets({ p, txs, toast }) {
  const [mk, setMk] = useState(C.monthKey(today()));
  const [edit, setEdit] = useState(null);
  const [draft, setDraft] = useState({});
  const b = C.budgetStatus(p, txs, mk); const prevB = C.budgetStatus(p, txs, C.shiftMonthKey(mk, -1));
  const spendCats = allCategories(p).filter((c) => c !== C.CARD_PAYMENT && c !== C.INVESTMENT);
  const inc = p.income || {};
  const expected = C.num(inc.salary) + C.sum(inc.sources || [], (s) => s.amount);
  const fixedTotal = C.sum(p.fixed || [], (f) => f.amount);
  const nw = C.netWorth(p, txs);
  const save = (patch, msg) => saveProfile(Object.assign({}, p, patch)).then(() => msg && toast(msg)).catch((e) => toast('Not saved: ' + e.code));
  const [incDraft, setIncDraft] = useState(null);
  return html`<div className="screen">

    <div className="card">
      <h2>${monthName(mk, true)}<span className="spacer"></span><button className="link" onClick=${() => { setDraft(Object.assign({}, p.budgets)); setEdit('budgets'); }}>Edit budgets</button></h2>
      ${b.rows.length ? html`<div className="row" style=${{ alignItems: 'baseline' }}><span style=${{ fontFamily: 'var(--font-display)', fontSize: '30px', fontWeight: 700 }} className="num">${fmt(b.left)}</span><span className="muted">left of ${fmt(b.total)}</span></div>
        <div style=${{ margin: '8px 0 2px' }}><${Bar} value=${b.pct} level=${b.pct >= 1 ? 100 : b.pct >= 0.9 ? 90 : b.pct >= 0.75 ? 75 : 0} /></div>

    </div>
    ${b.rows.map((r) => html`<div className="card" key=${r.cat} style=${{ padding: '14px 16px' }}>
      <div className="row"><span className="grow" style=${{ fontWeight: 700 }}>${r.cat}</span>
        ${r.level ? html`<${Pill} tone=${r.level >= 100 ? 'bad' : 'warn'}>${r.level >= 100 ? 'Over budget' : r.level + '% reached'}</${Pill}>` : null}</div>
      <div style=${{ margin: '10px 0 8px' }}><${Bar} value=${r.pct} level=${r.level} /></div>
      <div className="row small num"><span className="grow">${fmt(r.spent)} of ${fmt(r.budget)} · ${pct(r.pct)}</span><span style=${{ fontWeight: 700, color: r.left < 0 ? 'var(--bad)' : 'var(--fg)' }}>${r.left < 0 ? fmt(-r.left) + ' over' : fmt(r.left) + ' left'}</span></div>
    </div>`)}
    ${b.unbudgeted.length ? html`<div className="card"><h2>Spending without a budget</h2>${b.unbudgeted.map((u) => html`<div className="row small" key=${u.cat} style=${{ padding: '4px 0' }}><span className="grow">${u.cat}</span><span className="num">${fmt(u.spent)}</span></div>`)}</div>` : null}
    ${prevB.rows.length ? html`<div className="small muted">${monthName(C.shiftMonthKey(mk, -1), true)}: ${prevB.left >= 0 ? fmt(prevB.left) + ' unused' : fmt(-prevB.left) + ' over'} across budgets (kept separate, not added to this month).</div>` : null}

    <div className="card"><h2>Monthly income<span className="spacer"></span><button className="link" onClick=${() => setIncDraft(clone(inc))}>Edit</button></h2>
      <div className="kv"><span>Take-home salary</span><span>${fmt(inc.salary)}</span><span>Payday</span><span>Day ${inc.payday || 1}</span>

    <div className="card"><h2>Fixed monthly costs<span className="spacer"></span><button className="link" onClick=${() => setEdit('fixed')}>Edit</button></h2>
      ${(p.fixed || []).length ? html`<div className="kv">${p.fixed.map((f) => html`<${React.Fragment} key=${f.id}><span>${f.name} <span className="muted small">day ${f.dueDay || '—'}${C.fixedPaid(f, txs, C.monthKey(today())) ? ' · paid' : ''}</span></span><span>${fmt(f.amount)}</span></${React.Fragment}>`)}

    </${Sheet}>` : null}
    ${edit === 'fixed' ? html`<${EditListSheet} title="Fixed monthly costs" items=${p.fixed} schema=${SCHEMAS.fixed} blank=${BLANKS.fixed} addLabel="Add fixed cost" onClose=${() => setEdit(null)} onSave=${(v) => save({ fixed: v }, 'Fixed costs saved')} />` : null}
    ${edit === 'planned' ? html`<${EditListSheet} title="Planned expenses" items=${(p.planned || []).filter((x) => !x.done)} schema=${SCHEMAS.planned} blank=${BLANKS.planned} addLabel="Add planned expense" onClose=${() => setEdit(null)} onSave=${(v) => save({ planned: v }, 'Saved')} />` : null}
    ${incDraft ? html`<${Sheet} title="Monthly income" onClose=${() => setIncDraft(null)}>
      <div className="grid2"><${Field} label="Take-home salary"><${NumInput} id="inc-sal" value=${incDraft.salary} onChange=${(v) => setIncDraft(Object.assign({}, incDraft, { salary: v }))} /></${Field}>

    </${Sheet}>` : null}
  </div>`;

function LoanCard({ l, p, toast }) {
  const [confirm, setConfirm] = useState(false);
  const done = C.num(l.remainingEmis) <= 0;
  async function paid() {
    const t = { id: C.uid(), type: 'expense', amount: C.num(l.emi), name: l.lender + ' EMI', category: 'EMIs', date: today(), method: 'Bank Transfer', notes: '', createdAt: Date.now(), loanId: l.id };
    const interest = C.num(l.outstanding) * C.num(l.rate) / 1200;
    const loans = p.loans.map((x) => x.id !== l.id ? x : Object.assign({}, x, {
      remainingEmis: Math.max(0, C.num(x.remainingEmis) - 1), nextDate: x.nextDate ? C.addMonths(x.nextDate, 1) : '',
      outstanding: Math.max(0, Math.round(C.num(x.outstanding) - Math.max(0, C.num(x.emi) - interest))),
    }));
    setConfirm(false);
    try { await Promise.all([saveTx(t, null), saveProfile(Object.assign({}, p, { loans }))]); toast('EMI recorded · ' + fmt(t.amount)); } catch (e) { toast('Not saved: ' + e.code); }
  }
  const paidPct = C.num(l.original) ? 1 - C.num(l.outstanding) / C.num(l.original) : null;
  return html`<div className="item">
    <div className="row"><span className="grow" style=${{ fontWeight: 700 }}>${l.lender || 'Loan'}</span>${done ? html`<${Pill} tone="good">Closed</${Pill}>` : l.nextDate ? html`<${Pill} tone=${l.nextDate < today() ? 'bad' : C.daysBetween(today(), l.nextDate) <= 5 ? 'warn' : ''}>Next ${shortDate(l.nextDate)}</${Pill}>` : null}</div>
    <div className="kv"><span>Outstanding principal</span><span>${fmt(l.outstanding)}</span><span>EMI</span><span>${fmt(l.emi)}</span>
      <span>Interest rate</span><span>${l.rate !== '' && l.rate != null ? l.rate + '%' : '—'}</span><span>EMIs left</span><span>${l.remainingEmis || 0}</span></div>
    ${paidPct != null ? html`<${Bar} value=${paidPct} /><div className="small muted">${pct(paidPct)} of ${fmt(l.original)} repaid</div>` : null}
    ${done ? null : confirm ? html`<div className="row"><span className="grow small">Record ${fmt(l.emi)} paid today?</span><button className="btn sm" onClick=${() => setConfirm(false)}>Cancel</button><button className="btn sm primary" onClick=${paid}>Confirm</button></div>`
      : html`<button className="btn sm" style=${{ alignSelf: 'flex-start' }} onClick=${() => setConfirm(true)}>Mark this month's EMI paid</button>`}
  </div>`;
}

function IOUs({ p, toast, save }) {
  const [side, setSide] = useState('lent');
  const [edit, setEdit] = useState(false);
  const [payFor, setPayFor] = useState(null);
  const [amt, setAmt] = useState('');
  const d = today();
  const list = p[side] || [];
  const total = C.sum(list, C.iouLeft);
  function recordPayment(x) {
    const a = C.num(amt); if (!(a > 0)) return;
    const upd = list.map((y) => y.id !== x.id ? y : Object.assign({}, y, { payments: (y.payments || []).concat([{ amount: Math.min(a, C.iouLeft(y)), date: d }]) }));
    save({ [side]: upd }, side === 'lent' ? 'Repayment received · ' + fmt(a) : 'Payment recorded · ' + fmt(a));
    setPayFor(null); setAmt('');
  }
  return html`<${React.Fragment}>
    <${Seg} value=${side} onChange=${setSide} options=${[{ v: 'lent', l: 'Owed to me' }, { v: 'borrowed', l: 'I owe' }]} />
    <div className="stat"><span className="k">${side === 'lent' ? 'Still to come back to you' : 'You still owe'}</span><span className="v num">${fmt(total)}</span></div>
    <div className="card"><h2>${side === 'lent' ? 'Money owed to me' : 'Money I owe'}<span className="spacer"></span><button className="link" onClick=${() => setEdit(true)}>Add / edit</button></h2>
      ${list.length ? html`<div className="stack">${list.slice().sort((a, b) => C.iouLeft(b) - C.iouLeft(a)).map((x) => { const st = C.iouStatus(x, d); return html`<div className="item" key=${x.id}>
        <div className="row"><span className="grow" style=${{ fontWeight: 700 }}>${x.person || '—'}</span><${Pill} tone=${st === 'Settled' ? 'good' : st === 'Overdue' ? 'bad' : st === 'Partly paid' ? 'warn' : ''}>${st}</${Pill}></div>
        <div className="kv"><span>Amount</span><span>${fmt(x.amount)}</span><span>${side === 'lent' ? 'Received' : 'Paid'}</span><span>${fmt(C.iouPaid(x))}</span><span>Remaining</span><span>${fmt(C.iouLeft(x))}</span>
          <span>${side === 'lent' ? 'Lent on' : 'Borrowed on'}</span><span>${shortDate(x.date)}</span><span>${side === 'lent' ? 'Expected back' : 'Due'}</span><span>${shortDate(side === 'lent' ? x.expected : x.due)}</span></div>
        ${x.notes ? html`<div className="small muted">${x.notes}</div>` : null}
        ${C.iouLeft(x) > 0 ? (payFor === x.id ? html`<div className="row"><${NumInput} id=${'pay-' + x.id} value=${amt} placeholder=${String(C.iouLeft(x))} onChange=${setAmt} /><button className="btn sm primary" onClick=${() => recordPayment(x)}>Save</button><button className="btn sm" onClick=${() => setPayFor(null)}>Cancel</button></div>`
          : html`<button className="btn sm" style=${{ alignSelf: 'flex-start' }} onClick=${() => { setPayFor(x.id); setAmt(C.iouLeft(x)); }}>${side === 'lent' ? 'Record money received' : 'Record a payment'}</button>`) : null}
      </div>`; })}</div>` : html`<div className="empty">${side === 'lent' ? 'Nobody owes you money. Shared bills you split in Add land here automatically.' : 'You do not owe anyone.'}</div>`}</div>
    ${edit ? html`<${EditListSheet} title=${side === 'lent' ? 'Money owed to me' : 'Money I owe'} items=${list} schema=${SCHEMAS[side]} blank=${BLANKS[side]} addLabel="Add entry" onClose=${() => setEdit(false)} onSave=${(v) => save({ [side]: v }, 'Saved')}
      note=${side === 'lent' ? 'Entries dated after your last bank-balance update are deducted from the balance (the money left your account).' : 'Entries dated after your last bank-balance update are added to the balance (the money came in).'} />` : null}
  </${React.Fragment}>`;
}
